# Production-style local stack: PostgreSQL + API + nginx-served frontend.
#
#   cp .env.example .env        # then set SECRET_KEY, POSTGRES_PASSWORD, hosts
#   docker compose up -d --build
#   open http://localhost:8080
#
# The "migrate" service applies Alembic migrations explicitly before the API
# starts; in production mode the API itself refuses to start on an old schema.
# For a demo with seeded data, set APP_ENV=development and SEED_DEMO_DATA=true.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crms
      POSTGRES_USER: crms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crms -d crms"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://crms:${POSTGRES_PASSWORD}@db:5432/crms
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file: .env
    environment: *backend-env
    volumes:
      - model-data:/var/lib/ai-crms/models
      - upload-data:/var/lib/ai-crms/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  model-data:
  upload-data:
